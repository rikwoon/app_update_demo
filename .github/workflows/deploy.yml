name: 发布 GitHub Pages 网站

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 获取仓库文件
        uses: actions/checkout@v6

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传 site 文件夹
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: 发布网站
        id: deployment
        uses: actions/deploy-pages@v4